services:
  database:
    image: postgres:17-alpine
    container_name: lokia_db
    environment:
      POSTGRES_USER: ${PostgreUser}
      POSTGRES_PASSWORD: ${PostgrePassword}
      POSTGRES_DB: ${PostgreDB}
    ports:
      - "${PostgrePort}:5432"
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - lokia_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PostgreUser} -d ${PostgreDB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend: 
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: lokia_backend
    restart: always
    ports:
      - "${BACKEND_PORT}:5005"
    environment:
      - PostgreUser=${PostgreUser}
      - PostgrePassword=${PostgrePassword}
      - PostgreDB=${PostgreDB}
      - PostgrePort=5432
      - PostgreHost=${PostgreHost}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - lokia_network

  ollama:
    image: ollama/ollama:latest
    container_name: lokia_IA
    ports:
      - "${OllamaPort}:11434"
    volumes:
      - ./ollama:/model_files:Z
      - ./ollama:/root/.ollama:Z
    entrypoint: ["/bin/sh", "./model_files/run_ollama.sh"]
    networks:
      - lokia_network
  
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: lokia_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:5000"
    volumes:
      - ./frontend:/app:Z
      - /app/node_modules
    environment:
      API_BASE_URL: ${API_BASE_URL}
    depends_on:
      - backend
    networks:
      - lokia_network

volumes:
  db:

networks: 
  lokia_network: