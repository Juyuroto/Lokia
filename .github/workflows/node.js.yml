name: Lokia CI/CD (frontend)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-validation:
    runs-on: ubuntu-latest
    
    env:
      FRONTEND_PORT: ${{ secrets.FRONTEND_PORT }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

    steps:
      - name: Recorporer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances Frontend
        run: |
          cd frontend
          npm ci

      - name: Compiler l'application React (Build)
        run: |
          cd frontend
          npm run builda création, on ne publie rien pour le moment
          tags: lokia-backend:test
