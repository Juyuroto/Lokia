name: Lokia CI/CD (Docker)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  docker-check:
    runs-on: ubuntu-latest    
    steps:
      - name: Recorporer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tester la construction de l'image Docker du Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/dockerfile
          push: false 
          tags: lokia-backend:test

      - name: Tester la construction de l'image Docker du Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/dockerfile
          push: false 
          tags: lokia-frontend:test
